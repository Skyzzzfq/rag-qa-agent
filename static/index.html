<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能文档问答系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4f46e5;--primary-light:#818cf8;--primary-dark:#3730a3;
  --bg:#f1f5f9;--card:#fff;--text:#1e293b;--text-light:#64748b;
  --border:#e2e8f0;--user-bubble:#4f46e5;--bot-bubble:#f8fafc;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  --radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

/* === 顶部导航 === */
.navbar{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-lg);z-index:10;position:relative}
.navbar h1{font-size:20px;font-weight:600;letter-spacing:.5px}
.navbar .subtitle{font-size:12px;opacity:.8;margin-left:12px}
.nav-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,.25)}

/* === 主布局 === */
.main{display:flex;height:calc(100vh - 54px)}

/* === 左侧边栏 === */
.sidebar{width:300px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s}
.sidebar.hidden{transform:translateX(-300px);width:0;overflow:hidden;border:none}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;color:var(--text-light)}
.upload-area{padding:16px 20px;border-bottom:1px solid var(--border)}
.upload-btn{width:100%;padding:10px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s}
.upload-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.doc-list{flex:1;overflow-y:auto;padding:8px 12px}
.doc-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;margin-bottom:4px;transition:background .15s}
.doc-item:hover{background:var(--bg)}
.doc-icon{font-size:20px;margin-right:10px}
.doc-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-del{background:none;border:none;color:var(--text-light);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:4px;opacity:0;transition:all .15s}
.doc-item:hover .doc-del{opacity:1}
.doc-del:hover{color:#ef4444;background:#fef2f2}
.empty-docs{color:var(--text-light);font-size:13px;text-align:center;padding:40px 20px;line-height:1.8}

/* === 右侧对话区 === */
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.chat-messages{flex:1;overflow-y:auto;padding:24px 32px}
.welcome{text-align:center;padding:80px 40px;color:var(--text-light)}
.welcome-icon{font-size:64px;margin-bottom:16px}
.welcome h2{font-size:22px;color:var(--text);margin-bottom:8px}
.welcome p{font-size:14px;line-height:1.8}

/* 消息气泡 */
.msg{margin-bottom:20px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg.bot{align-items:flex-start}
.msg-bubble{max-width:70%;padding:12px 18px;border-radius:var(--radius);font-size:14px;line-height:1.7;word-break:break-word;white-space:pre-wrap}
.msg.user .msg-bubble{background:var(--user-bubble);color:#fff;border-bottom-right-radius:4px}
.msg.bot .msg-bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.msg-source{margin-top:6px;font-size:12px;color:var(--text-light);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.source-tag{background:#eef2ff;color:var(--primary);padding:2px 10px;border-radius:20px;font-size:11px}

/* 打字指示器 */
.typing{display:flex;align-items:center;gap:4px;padding:12px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);border-bottom-left-radius:4px;box-shadow:var(--shadow);max-width:70px}
.typing span{width:8px;height:8px;background:var(--text-light);border-radius:50%;animation:bounce 1.4s infinite both}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* 输入区 */
.chat-input{padding:16px 24px;background:var(--card);border-top:1px solid var(--border)}
.input-wrap{display:flex;gap:10px;align-items:flex-end}
.input-wrap textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:120px;transition:border-color .2s;line-height:1.5}
.input-wrap textarea:focus{border-color:var(--primary)}
.send-btn{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:10px;padding:12px 20px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:all .2s}
.send-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* toast */
.toast{position:fixed;top:70px;right:20px;padding:12px 20px;border-radius:8px;font-size:13px;color:#fff;z-index:999;animation:slideIn .3s;box-shadow:var(--shadow-lg)}
.toast.success{background:#10b981}
.toast.error{background:#ef4444}
.toast.info{background:var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* 滚动条 */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* 响应式 */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:54px;bottom:0;z-index:20;box-shadow:var(--shadow-lg)}
  .sidebar.hidden{transform:translateX(-300px)}
  .msg-bubble{max-width:85%}
  .chat-messages{padding:16px}
}
</style>
</head>
<body>

<div class="navbar">
  <div style="display:flex;align-items:baseline">
    <h1>智能文档问答系统</h1>
    <span class="subtitle">基于 RAG + LLM 技术</span>
  </div>
  <button class="nav-btn" onclick="toggleSidebar()">文档管理</button>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">文档管理</div>
    <div class="upload-area">
      <input type="file" id="fileInput" accept=".pdf,.md,.markdown,.txt,.docx" style="display:none" onchange="uploadFile(this)">
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ 上传文档</button>
      <div style="font-size:12px;color:var(--text-light);margin-top:8px;text-align:center">支持 PDF、Markdown、TXT、Word 格式</div>
    </div>
    <div class="doc-list" id="docList"></div>
  </div>

  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">📚</div>
        <h2>欢迎使用智能文档问答系统</h2>
        <p>请先在左侧上传文档，然后在这里提问<br>系统将基于文档内容为您生成回答</p>
      </div>
    </div>
    <div class="chat-input">
      <div class="input-wrap">
        <textarea id="questionInput" rows="1" placeholder="输入您的问题..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendQuestion()">发 送</button>
      </div>
    </div>
  </div>
</div>

<script>
let sessionId = null;
let isLoading = false;

// --- 初始化 ---
document.addEventListener('DOMContentLoaded', () => {
  loadDocuments();
  document.getElementById('questionInput').focus();
});

// --- 侧边栏 ---
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('hidden');
}

// --- 文档管理 ---
async function loadDocuments() {
  try {
    const resp = await fetch('/documents/list');
    const data = await resp.json();
    renderDocList(data.documents);
  } catch (e) {
    console.error('加载文档列表失败', e);
  }
}

function renderDocList(docs) {
  const el = document.getElementById('docList');
  el.replaceChildren();
  if (!docs.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-docs';
    empty.append('暂无文档', document.createElement('br'), '请上传 PDF、Markdown、TXT 或 Word 文件');
    el.appendChild(empty);
    return;
  }
  docs.forEach(d => {
    const ext = d.filename.split('.').pop().toLowerCase();
    const icon = ext === 'pdf' ? '📕' : '📄';
    const item = document.createElement('div');
    item.className = 'doc-item';

    const iconEl = document.createElement('span');
    iconEl.className = 'doc-icon';
    iconEl.textContent = icon;

    const nameEl = document.createElement('span');
    nameEl.className = 'doc-name';
    nameEl.title = d.filename;
    nameEl.textContent = d.filename;

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'doc-del';
    deleteBtn.title = '删除';
    deleteBtn.textContent = '×';
    deleteBtn.addEventListener('click', () => deleteDoc(d.filename));

    item.append(iconEl, nameEl, deleteBtn);
    el.appendChild(item);
  });
}

async function uploadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  showToast('正在上传文档...', 'info');
  try {
    const resp = await fetch('/documents/upload', { method: 'POST', body: formData });
    if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || '上传失败'); }
    const data = await resp.json();
    showToast(`上传成功：${data.filename}（${data.chunk_count} 个文本块）`, 'success');
    loadDocuments();
  } catch (e) {
    showToast('上传失败：' + e.message, 'error');
  }
  input.value = '';
}

async function deleteDoc(name) {
  if (!confirm(`确定删除文档「${name}」吗？`)) return;
  try {
    const resp = await fetch(`/documents/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (!resp.ok) throw new Error('删除失败');
    showToast('文档已删除', 'success');
    loadDocuments();
  } catch (e) {
    showToast('删除失败：' + e.message, 'error');
  }
}

// --- 问答 ---
async function sendQuestion() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question || isLoading) return;

  // 隐藏欢迎页
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  // 添加用户消息
  addMessage('user', question);
  input.value = '';
  autoResize(input);

  // 显示加载
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  const typingEl = addTyping();

  try {
    const resp = await fetch('/qa/ask/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: sessionId })
    });
    if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || '请求失败'); }

    typingEl.remove();
    const botBubble = addMessage('bot', '');
    const bubbleEl = botBubble.querySelector('.msg-bubble');
    const statusArea = document.createElement('div');
    statusArea.className = 'msg-status';
    botBubble.insertBefore(statusArea, bubbleEl);
    let fullAnswer = '';
    let sources = [];
    let toolActive = false;

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let currentEvent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('event:')) {
          currentEvent = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          const data = line.slice(5).trim();
          if (!data) continue;

          if (currentEvent === 'session') {
            sessionId = data;
          } else if (currentEvent === 'sources') {
            try { sources = JSON.parse(data); } catch(e) { sources = []; }
          } else if (currentEvent === 'token') {
            if (toolActive) {
              statusArea.innerHTML = '';
              toolActive = false;
            }
            let token = data;
            try { token = JSON.parse(data); } catch(e) {}
            fullAnswer += token;
            bubbleEl.textContent = fullAnswer;
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
          } else if (currentEvent === 'tool_start') {
            toolActive = true;
            try {
              const info = JSON.parse(data);
              setToolStatus(statusArea, `正在调用 ${info.tool}...`, '#fef3c7', '#92400e');
            } catch(e) {}
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
          } else if (currentEvent === 'tool_end') {
            try {
              const info = JSON.parse(data);
              setToolStatus(statusArea, `${info.tool} 已返回`, '#d1fae5', '#065f46');
            } catch(e) {}
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
          } else if (currentEvent === 'error') {
            fullAnswer += data;
            bubbleEl.textContent = fullAnswer;
          } else if (currentEvent === 'done') {
            statusArea.innerHTML = '';
          }
          currentEvent = '';
        }
      }
    }
    statusArea.innerHTML = '';
    bubbleEl.textContent = fullAnswer;
    addSources(botBubble, sources);
  } catch (e) {
    typingEl.remove();
    addMessage('bot', '抱歉，出了点问题：' + e.message);
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
}

function addMessage(role, text, sources) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  div.appendChild(bubble);

  if (role === 'bot' && sources && sources.length) {
    addSources(div, sources);
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function addSources(messageEl, sources) {
  if (!sources || !sources.length) return;
  const src = document.createElement('div');
  src.className = 'msg-source';
  const label = document.createElement('span');
  label.textContent = '来源：';
  src.appendChild(label);
  sources.forEach(source => {
    const tag = document.createElement('span');
    tag.className = 'source-tag';
    tag.textContent = source;
    src.appendChild(tag);
  });
  messageEl.appendChild(src);
}

function setToolStatus(statusArea, text, background, color) {
  const tag = document.createElement('span');
  tag.className = 'source-tag';
  tag.style.background = background;
  tag.style.color = color;
  tag.textContent = text;
  statusArea.replaceChildren(tag);
}

function addTyping() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// --- Toast ---
function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
}
</script>
</body>
</html>
